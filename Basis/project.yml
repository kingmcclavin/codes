name: Basis
options:
  # Bundle IDs keep the original "inkpad" name so installed copies update
  # in place and keep their notes.
  bundleIdPrefix: com.example.inkpad
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Basis:
    type: application
    platform: iOS
    sources:
      - path: Basis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.inkpad
        PRODUCT_NAME: Basis
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Basis
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  BasisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BasisTests
    dependencies:
      - target: Basis
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.inkpad.tests
        TARGETED_DEVICE_FAMILY: "2"

schemes:
  Basis:
    build:
      targets:
        Basis: all
        BasisTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BasisTests
    archive:
      config: Release
