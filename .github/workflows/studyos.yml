# Builds StudyOS in the cloud so no Mac is needed:
#  - runs the logic tests (models, persistence, grade/GPA/study calculations)
#  - compiles the full Swift Playgrounds app package for iPad
#  - packages an UNSIGNED .ipa as a downloadable artifact for sideloading
#    (sideloading tools such as AltStore or SideStore sign it with your Apple ID)
name: StudyOS

on:
  push:
    paths:
      - "StudyOS/**"
      - ".github/workflows/studyos.yml"
  pull_request:
    paths:
      - "StudyOS/**"
      - ".github/workflows/studyos.yml"
  workflow_dispatch:

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run logic tests
        run: StudyOS/Tests/run-logic-tests.sh

  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: List schemes
        working-directory: StudyOS/StudyOS.swiftpm
        run: xcodebuild -list
      - name: Build app (unsigned)
        working-directory: StudyOS/StudyOS.swiftpm
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme StudyOS \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"
      - name: Package .ipa
        run: |
          app="$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 -name 'StudyOS.app' -type d | head -1)"
          test -n "$app" || { echo "StudyOS.app not found"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/StudyOS-unsigned.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/StudyOS-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: StudyOS-unsigned-ipa
          path: StudyOS-unsigned.ipa
          if-no-files-found: error

  # Launches the app in an iPad simulator and screenshots each section,
  # proving it starts and renders (not just compiles).
  simulator-smoke-test:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPad simulator
        working-directory: StudyOS/StudyOS.swiftpm
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme StudyOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/SimData" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/sim-build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/sim-build.log"
      - name: Launch and screenshot
        run: |
          app="$(find "$RUNNER_TEMP/SimData/Build/Products" -maxdepth 2 -name 'StudyOS.app' -type d | head -1)"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          device="$(xcrun simctl list devices available | grep -E 'iPad Pro 13-inch|iPad Air 13-inch|iPad Pro|iPad Air' | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          echo "App: $app  Bundle: $bundle_id  Device: $device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl ui "$device" appearance light
          xcrun simctl install "$device" "$app"
          mkdir -p screenshots
          for section in dashboard courses assignments grades study more; do
            xcrun simctl terminate "$device" "$bundle_id" 2>/dev/null || true
            xcrun simctl launch "$device" "$bundle_id" -StudyOSSampleData YES -StudyOSSection "$section"
            sleep 6
            # The app must still be running (no crash on launch or render).
            xcrun simctl spawn "$device" launchctl list | grep -q "$bundle_id" || { echo "StudyOS is not running after opening $section"; exit 1; }
            xcrun simctl io "$device" screenshot "screenshots/$section.png"
          done
          xcrun simctl ui "$device" appearance dark
          xcrun simctl terminate "$device" "$bundle_id" || true
          xcrun simctl launch "$device" "$bundle_id" -StudyOSSection dashboard
          sleep 6
          xcrun simctl io "$device" screenshot "screenshots/dashboard-dark.png"
          ls -la screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StudyOS-screenshots
          path: screenshots
      - name: Publish screenshots to the studyos-screenshots branch
        if: github.event_name != 'pull_request'
        run: |
          cd screenshots
          git init -q -b studyos-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "StudyOS screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" studyos-screenshots
